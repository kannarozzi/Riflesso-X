[package]
name = "riflesso-setup"
description = "The downloadable installer of Riflesso X: unpacks the app and starts it in setup mode"
version.workspace = true
edition.workspace = true
license.workspace = true

# Windows only: on Linux the app ships as a package (AppImage, .deb, .rpm).
[target.'cfg(windows)'.dependencies]
zstd = "0.13"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
zstd = "0.13"
embed-resource = "3"
