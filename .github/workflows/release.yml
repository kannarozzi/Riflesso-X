# Builds the release files on every version tag (v1.0.0, ...) and attaches them
# to a draft GitHub release, to be checked and published by hand.
#
# Signing (SignPath Foundation, see CODE_SIGNING_POLICY.md) runs when the
# repository has the secret SIGNPATH_API_TOKEN and the variable
# SIGNPATH_ORGANIZATION_ID: the app and the command line are signed first, then
# the installer is built around the signed app and signed in turn.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build the app and the command line
        run: node scripts/release.mjs app

      - name: Upload the app for signing
        if: env.SIGNING == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: |
            target/release/riflesso-x.exe
            target/release/riflesso.exe

      - name: Sign the app and the command line
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'riflesso-x' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/release

      - name: Build the installer around the app
        run: node scripts/release.mjs setup

      - name: Upload the installer for signing
        if: env.SIGNING == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: target/release/riflesso-setup.exe

      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'riflesso-x' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/release

      - name: Package the release files
        run: node scripts/release.mjs package

      - name: Keep the files with the run
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/

      - name: Attach them to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --draft --title "Riflesso X ${{ github.ref_name }}" --notes-file CHANGELOG.md
