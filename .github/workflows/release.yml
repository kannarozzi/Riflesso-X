# Builds the release files on every version tag (v1.0.0, ...) and attaches them
# to a draft GitHub release, to be checked and published by hand. Windows and
# Linux build side by side; a last job puts their files in one release with
# one SHA256SUMS.txt.
#
# Signing (SignPath Foundation, see CODE_SIGNING_POLICY.md) runs when the
# repository has the secret SIGNPATH_API_TOKEN and the variable
# SIGNPATH_ORGANIZATION_ID: the app and the command line are signed first, then
# the installer is built around the signed app and signed in turn.

name: Release
# Otherwise a tag's run is titled after its commit, and a manual run "Release".
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Test build ({0})', github.ref_name) }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build the app and the command line
        run: node scripts/release.mjs app

      - name: Upload the app for signing
        if: env.SIGNING == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: |
            target/release/riflesso-x.exe
            target/release/riflesso.exe

      - name: Sign the app and the command line
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'riflesso-x' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/release

      - name: Build the installer around the app
        run: node scripts/release.mjs setup

      - name: Upload the installer for signing
        if: env.SIGNING == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: target/release/riflesso-setup.exe

      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'riflesso-x' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/release

      - name: Package the release files
        run: node scripts/release.mjs package

      - name: Keep the files with the run
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/

  # The oldest supported Ubuntu, so that the packages run on distributions with
  # an older glibc too (Ubuntu 22.04+, Debian 12+, Fedora 36+).
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the system libraries
        # The runner's libunwind-14-dev (from LLVM) conflicts with libunwind-dev,
        # which GStreamer's headers need.
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build the packages and the command line
        run: node scripts/release.mjs

      - name: Keep the files with the run
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: "{windows,linux}"
          merge-multiple: true
          path: release

      - name: One checksum file for all
        working-directory: release
        run: |
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach them to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # Titled "Riflesso X 1.2.0", with this version's section of the changelog
        # as a starting point for the notes.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version" '$0 == head { p = 1; next } /^## / { p = 0 } p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --draft --title "Riflesso X $version" --notes-file notes.md
